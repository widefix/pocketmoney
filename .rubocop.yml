inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  Exclude:
    # Generated by Rails; regenerated on every migration, so fixing style here
    # is undone the next time the schema is dumped.
    - "db/schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"

Style/Documentation:
  Description: Document classes and non-namespace modules.
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "db/**/*"
    - "spec/**/*_spec.rb"

Metrics/MethodLength:
  Exclude:
    - "db/**/*"

Metrics/AbcSize:
  Exclude:
    - "db/**/*"

Naming/PredicateMethod:
  Exclude:
    # Returns true to keep the mailer callback chain running, not as a predicate.
    - "app/mailers/application_mailer.rb"
