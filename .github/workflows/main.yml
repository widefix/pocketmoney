---
name: 'deploy'

# Deploys only after "Ruby on Rails CI" passes on master, so a red build never
# reaches production. workflow_dispatch allows a manual deploy or a re-run.
on:
  workflow_run:
    workflows: ["Ruby on Rails CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.6'

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # config/deploy.yml points Kamal at ~/.ssh/id_hetzner, both for the
      # deploy itself and for the remote amd64 builder.
      # No `-H`: SSHKit 1.25.1, which Kamal uses for SSH, only reads the first
      # hashed entry per host, and ssh-keyscan writes one line per key type in
      # an order that varies between runs, so hashed output fails with
      # Net::SSH::HostKeyMismatch whenever ED25519 is not the first line.
      - name: Install the deploy SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_hetzner
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_hetzner
          ssh-keyscan 46.225.238.176 >> ~/.ssh/known_hosts

      # Every other credential lives in the committed, encrypted vault, so the
      # vault password is the only secret CI needs besides the SSH key.
      - name: Install ansible-vault
        run: pipx install ansible-core

      - name: Write the vault password
        run: |
          mkdir -p config/deploy
          install -m 600 /dev/null config/deploy/.production-vault-password
          printf '%s' "${{ secrets.PRODUCTION_VAULT_PASSWORD }}" > config/deploy/.production-vault-password

      - name: Decrypt secrets
        run: bin/sync-production-secrets

      # Goes through the same SSHKit code path as the deploy, so a host key or
      # SSH key problem fails here with a short, readable error.
      - name: Verify SSH access to the server
        run: kamal server exec --quiet "echo connected as \$(whoami)"

      - name: Deploy
        run: kamal deploy

      - name: Release the deploy lock if the deploy failed
        if: failure()
        run: kamal lock release || true

      - name: Remove decrypted secrets from the runner
        if: always()
        run: rm -f .kamal/secrets config/deploy/.production-vault-password
