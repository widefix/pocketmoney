# Shape of config/deploy/production.secrets.vault.yml, which is the same file
# encrypted with ansible-vault. To change a secret:
#
#   ansible-vault edit --vault-password-file config/deploy/.production-vault-password \
#     config/deploy/production.secrets.vault.yml
#   bin/sync-production-secrets
#
# POSTGRES_PASSWORD and MB_DB_PASS are not listed: bin/sync-production-secrets
# derives them from DB_PASSWORD and METABASE_DB_PASSWORD.
KAMAL_REGISTRY_PASSWORD: ''   # GitHub PAT with write:packages
SECRET_KEY_BASE: ''           # openssl rand -hex 64
DB_PASSWORD: ''               # app + Postgres accessory
METABASE_DB_PASSWORD: ''      # Metabase application database
GOOGLE_CLIENT_SECRET: ''
FACEBOOK_APP_SECRET: ''
AWS_ACCESS_KEY_ID: ''
AWS_ACCESS_SECRET_KEY_ID: ''
SMTP_PASSWORD: ''
ROLLBAR_ACCESS_TOKEN: ''
NEW_RELIC_LICENSE_KEY: ''
