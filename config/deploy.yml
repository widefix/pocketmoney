# Kamal deployment for BudgetingKid (Rails 7.2 / Ruby 3.4.6)
service: budgetingkid

image: ka8725/budgetingkid

servers:
  web:
    - 46.225.238.176

ssh:
  # Non-root deploy user (member of the docker group). Root stays available
  # for administration but is not used by Kamal or CI.
  user: deploy
  keys:
    # Override with KAMAL_SSH_KEY when your key for this server lives elsewhere
    # (each teammate names it differently; CI writes it to the default path).
    - <%= ENV.fetch("KAMAL_SSH_KEY", "~/.ssh/id_hetzner") %>

proxy:
  ssl: true
  hosts:
    - budgetingkid.com
    - app.budgetingkid.com
  app_port: 3000
  healthcheck:
    path: /health
    interval: 5
    timeout: 60

registry:
  server: ghcr.io
  username: ka8725
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Build from the working tree instead of a clean git clone of HEAD.
  context: .
  # The workstation is arm64; building on the amd64 target host avoids QEMU.
  remote: ssh://deploy@46.225.238.176

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    # kamal-proxy does not serve static files, so Rails must.
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_MAX_THREADS: "5"
    PORT: "3000"

    DB_HOST: budgetingkid-db
    DB_PORT: "5432"
    DB_NAME: budgetingkid_production
    DB_USER: budgetingkid

    GOOGLE_CLIENT_ID: 233724073796-kopenm87gf9ulm02s0vt2kj0rr0vl1dt.apps.googleusercontent.com
    GOOGLE_TAG_ID: G-Q4122NBV14
    FACEBOOK_APP_ID: "310779685135114"

    AWS_BUCKET: budgetingkid
    AWS_REGION: us-east-1

    SMTP_SERVER: smtp.mailgun.org
    SMTP_PORT: "587"
    SMTP_DOMAIN: sandbox6244ce40ef994f79a6c2e5a25aaace04.mailgun.org
    SMTP_LOGIN: app@sandbox6244ce40ef994f79a6c2e5a25aaace04.mailgun.org
    SMTP_DEFAULT_FROM: BudgetingKid <no-reply@budgetingkid.com>
  secret:
    - SECRET_KEY_BASE
    - DB_PASSWORD
    - GOOGLE_CLIENT_SECRET
    - FACEBOOK_APP_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_ACCESS_SECRET_KEY_ID
    - SMTP_PASSWORD
    - ROLLBAR_ACCESS_TOKEN
    - NEW_RELIC_LICENSE_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  dbc: accessory exec db --interactive --reuse "psql -U budgetingkid budgetingkid_production"

accessories:
  db:
    # Must stay on PG 16 to match the publisher (144.126.196.2 runs 16.2).
    image: postgres:16.2
    host: 46.225.238.176
    env:
      clear:
        POSTGRES_DB: budgetingkid_production
        POSTGRES_USER: budgetingkid
      secret:
        - POSTGRES_PASSWORD
    directories:
      # Absolute path on purpose: a relative one resolves inside the SSH user's
      # home, so changing `ssh.user` would silently boot an empty database.
      - /var/lib/budgetingkid/postgres:/var/lib/postgresql/data
    cmd: >-
      postgres -c wal_level=logical -c max_replication_slots=10
      -c max_logical_replication_workers=10 -c max_worker_processes=16

  metabase:
    # Pinned to the version the application database was created by (0.49.9);
    # a newer image would migrate that schema irreversibly.
    image: metabase/metabase:v0.49.9
    host: 46.225.238.176
    env:
      clear:
        MB_DB_TYPE: postgres
        MB_DB_HOST: budgetingkid-db
        MB_DB_PORT: "5432"
        MB_DB_DBNAME: metabase
        MB_DB_USER: metabase
        MB_JETTY_PORT: "3000"
        # The host has 3.7 GB RAM shared with the app and Postgres.
        JAVA_OPTS: -Xmx1024m
      secret:
        - MB_DB_PASS
